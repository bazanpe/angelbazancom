<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/tools.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="https://a.favicon.im/angelbazan.com" />
  <title>Calculadora CPL, ROAS y ROI — Angel Bazán</title>
  <meta name="description" content="Calcula tu costo por lead, ROAS, costo por venta y ganancia neta en segundos. La calculadora de métricas para Meta Ads." />
  <link rel="canonical" href="https://angelbazan.com/tools/calculadora-cpl-roas" />
</head>
<body>
  <div class="tool-top"><div class="tool-top-inner">
    <a class="tool-logo" href="../"><img src="https://angelbazan.com/wp-content/uploads/2020/01/AngelBazan-LOGO-2.png" alt="Angel Bazan" /></a>
    <a class="tool-back" href="../recursos">← Recursos</a>
  </div></div>
  <main class="tool-main">
    <h1>Calculadora CPL · ROAS · ROI</h1>
    <p class="tool-desc">Las 4 métricas que deciden si tu campaña de Meta Ads gana o pierde, en un solo cálculo. Perfecta para funnels de WhatsApp.</p>
    <div class="tool-box">
      <div class="row">
        <div><label>Inversión en anuncios</label><input type="number" id="spend" value="300" /></div>
        <div><label>Leads / conversaciones</label><input type="number" id="leads" value="60" /></div>
      </div>
      <div class="row">
        <div><label>Ventas</label><input type="number" id="sales" value="15" /></div>
        <div><label>Facturación</label><input type="number" id="rev" value="1200" /></div>
      </div>
      <div class="row">
        <div><label>Margen de ganancia (%)</label><input type="number" id="margin" value="60" /></div>
      </div>
      <div class="tool-actions">
        <button class="tbtn tbtn-green" onclick="calc()">Calcular</button>
      </div>
      <div class="tool-out" id="out">
        <div class="out-box" id="result"></div>
        <div class="tool-actions">
          <button class="tbtn tbtn-outline" onclick="copyResult()">Copiar resultado</button>
          <span class="copy-ok" id="ok">Copiado!</span>
        </div>
      </div>
    </div>
  </main>
  <footer class="tool-foot">© 2026 Angel Bazán — <a href="../recursos">Todos los recursos gratis</a></footer>
  <script>
    function calc() {
      var spend = +document.getElementById('spend').value || 0;
      var leads = +document.getElementById('leads').value || 0;
      var sales = +document.getElementById('sales').value || 0;
      var rev = +document.getElementById('rev').value || 0;
      var margin = +document.getElementById('margin').value || 0;
      var cpl = leads ? (spend / leads).toFixed(2) : '—';
      var roas = spend ? (rev / spend).toFixed(2) : '—';
      var cpv = sales ? (spend / sales).toFixed(2) : '—';
      var convRate = leads ? (sales / leads * 100).toFixed(1) : '—';
      var grossProfit = rev * margin / 100;
      var net = grossProfit - spend;
      var status = net >= 0 ? '✅ Campaña rentable' : '⚠️ Campaña en pérdida';
      var color = net >= 0 ? '#128C7E' : '#b91c1c';
      document.getElementById('result').innerHTML =
        '<p><b>Costo por lead (CPL):</b> ' + cpl + '</p>' +
        '<p><b>Costo por venta:</b> ' + cpv + '</p>' +
        '<p><b>ROAS:</b> ' + roas + 'x</p>' +
        '<p><b>Tasa de conversión a venta:</b> ' + convRate + '%</p>' +
        '<p><b>Ganancia neta (margen − inversión):</b> <span style="color:' + color + ';font-weight:bold;">' + net.toFixed(2) + '</span></p>' +
        '<p style="margin-top:8px;font-weight:bold;color:' + color + ';">' + status + '</p>';
      document.getElementById('out').classList.add('show');
    }
  
    function copyResult() {
      var el = document.getElementById('result');
      var txt = el.textContent || el.innerText;
      var ta = document.createElement('textarea');
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      var ok = document.getElementById('ok');
      ok.classList.add('show');
      setTimeout(function(){ ok.classList.remove('show'); }, 2000);
    }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../assets/tools.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="https://a.favicon.im/angelbazan.com" />
  <title>Generador de mensaje de bienvenida para WhatsApp Business — Angel Bazán</title>
  <meta name="description" content="Crea el mensaje de bienvenida automático de WhatsApp Business que saluda, da valor y presenta tu oferta." />
  <link rel="canonical" href="https://angelbazan.com/tools/mensaje-bienvenida-whatsapp" />
</head>
<body>
  <div class="tool-top"><div class="tool-top-inner">
    <a class="tool-logo" href="../"><img src="https://angelbazan.com/wp-content/uploads/2020/01/AngelBazan-LOGO-2.png" alt="Angel Bazan" /></a>
    <a class="tool-back" href="../recursos">← Recursos</a>
  </div></div>
  <main class="tool-main">
    <h1>Mensaje de bienvenida para WhatsApp Business</h1>
    <p class="tool-desc">El primer mensaje define la conversación. Genera el tuyo en segundos: saludo, valor y siguiente paso, listo para pegar en WhatsApp Business.</p>
    <div class="tool-box">
      <label>Nombre de tu negocio</label>
      <input type="text" id="biz" placeholder="Mi Negocio" />
      <label>Qué ofreces (en una línea)</label>
      <input type="text" id="offer" placeholder="cursos de marketing digital" />
      <label>Tu nombre (opcional)</label>
      <input type="text" id="name" placeholder="Angel" />
      <div class="tool-actions">
        <button class="tbtn tbtn-green" onclick="build()">Generar mensaje</button>
      </div>
      <div class="tool-out" id="out">
        <label>Tu mensaje de bienvenida</label>
        <textarea id="result" readonly></textarea>
        <div class="tool-actions">
          <button class="tbtn tbtn-outline" onclick="copy()">Copiar</button>
          <span class="copy-ok" id="ok">¡Copiado!</span>
        </div>
      </div>
    </div>
  </main>
  <footer class="tool-foot">© 2026 Angel Bazán — <a href="../recursos">Todos los recursos gratis</a></footer>
  <script>
    function build() {
      var biz = document.getElementById('biz').value.trim() || 'Mi Negocio';
      var offer = document.getElementById('offer').value.trim() || 'nuestros productos';
      var name = document.getElementById('name').value.trim();
      var msg = '¡Hola! 👋 Gracias por escribir a ' + biz + '.\n\n' +
        'En una línea te cuento: vendemos ' + offer + ' y en este chat respondemos todas tus dudas al instante.\n\n' +
        '¿Qué necesitas hoy? Responde:\n' +
        '1️⃣ Información y precios\n' +
        '2️⃣ Asesoría personalizada\n' +
        '3️⃣ Hablar con un humano 😄';
      document.getElementById('result').value = msg;
      document.getElementById('out').classList.add('show');
    }
    function copy() {
      var r = document.getElementById('result');
      r.select();
      document.execCommand('copy');
      var ok = document.getElementById('ok');
      ok.classList.add('show');
      setTimeout(function(){ ok.classList.remove('show'); }, 2000);
    }
  </script>
</body>
</html>
